AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 1024
    Timeout: 10

Resources:
  # 認証つきAPI Gateweay
  MyApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        ApiKeyRequired: true

  # APIキー
  MyApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: "music-stream-dev-key"
      Enabled: true

  # 使用量プラン
  MyApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    # 暗黙的に作られる「MyApiGatewayProdStage」の完成を絶対に待たせる
    DependsOn: MyApiGatewayProdStage
    Properties:
      UsagePlanName: "music-stream-usage-plan"
      ApiStages:
        - ApiId: !Ref MyApiGateway
          Stage: Prod # どの環境もStage名はProd

  # APIキーと使用量プランの紐付け
  MyApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref MyApiKey
      KeyType: "API_KEY"
      UsagePlanId: !Ref MyApiUsagePlan

  MySharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: "./layers/my-shared-layer"
      CompatibleRuntimes:
        - nodejs22.x
      Description: "Shared production node_modules managed by pnpm master package.json"

  GetMusicList:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./dist/getMusicList
      FunctionName: music-stream-api-get-music-list
      Handler: index.handler
      Layers:
        - Ref: MySharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: "music_tracks"
      Events:
        GetMusicListApi:
          Type: Api
          Properties:
            Path: /api/v1/music
            Method: get
            RestApiId:
              Ref: MyApiGateway
  GetMusicDetail:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./dist/getMusicDetail
      FunctionName: music-stream-api-get-music-detail
      Handler: index.handler
      Layers:
        - Ref: MySharedLayer
      Policies:
        - DynamoDBCrudPolicy:
          TableName: "music_tracks"
      Events:
        GetMusicDetailApi:
          Type: Api
          Properties:
            Path: /api/v1/music/{id}
            Method: get
            RestApiId:
              Ref: MyApiGateway

Outputs:
  TargetApiId:
    Description: "API Gateway ID created by SAM"
    Value:
      Ref: MyApiGateway
